version: 2
# One grouped PR per ecosystem per month. Security updates are separate and
# still arrive as soon as an advisory is published.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      pip:
        patterns: ["*"]
    ignore:
      # Deliberately pinned for the reproducible item-11 regression environment
      # (Python 3.10); bumps to these were closed as unwanted.
      - dependency-name: "numpy"
      - dependency-name: "scipy"
      - dependency-name: "gym"
