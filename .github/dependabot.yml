version: 2
# One grouped PR per ecosystem per month. Security updates are separate and
# still arrive as soon as an advisory is published.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    # Security updates only. The pip pins define the frozen Python 3.10 item-11
    # regression environment; version bumps break it (#34, #37, #53, #57).
    open-pull-requests-limit: 0
